[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crossarch-rl"
version = "0.1.0"
description = "CrossArch-RL: Few-Shot Cross-Architecture GPU Kernel Schedule RL via Hardware-Factored Value Decomposition"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "torch>=2.4",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
cloud = ["modal>=0.64"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
